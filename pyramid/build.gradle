plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    compileSdk 33
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        python {
            // 自动适配：在 Linux 云端使用系统 python3，本地 Windows 使用 python
            if (System.getProperty("os.name").toLowerCase().contains("windows")) {
                buildPython "python"
            } else {
                buildPython "python3"
            }
            pip {
                install "lxml"
                install "ujson"
                install "pyquery==2.0.2"
                install "requests"
                install "jsonpath"
                install "cachetools"
                install 'pycryptodome'
                install 'beautifulsoup4'
            }
        }
    }
    flavorDimensions "mode"
    productFlavors {
        python {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
        python32 {
            dimension "mode"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
        python64 {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }
    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main{
            // Android
            setRoot "src/main"
            // Python
            python.srcDirs = ["src/python"]
        }
    }
    buildToolsVersion '30.0.3'
}

dependencies {
}
